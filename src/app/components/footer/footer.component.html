<footer class="border-t border-[#C9D2D8] bg-[#EDF1F4]">
    <div class="mx-auto max-w-[1160px] px-6 pb-8 pt-16">

        <!-- Top section -->
        <div class="mb-16 grid grid-cols-1 gap-14 md:grid-cols-[1fr_auto]">

            <!-- Left: CTA -->
            <div>
                <p class="mb-4 flex items-center gap-2.5 font-sans text-[0.84rem] font-medium text-[#2955C8]">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="pulse absolute inline-flex h-full w-full rounded-full bg-[#2955C8] opacity-60"></span>
                        <span class="relative inline-flex h-2 w-2 rounded-full bg-[#2955C8]"></span>
                    </span>
                    พร้อมรับงาน
                </p>
                <h2 class="m-0 mb-6 font-display font-bold leading-[1.1] tracking-[-0.02em] text-[#14202B]"
                    style="font-size: clamp(1.9rem, 4.5vw, 3rem);">
                    มีโปรเจกต์ในใจไหม
                </h2>
                <a href="mailto:peerapatkallabut@gmail.com"
                    class="inline-flex items-center gap-3 border-none bg-[#2955C8] px-6 py-3.5 font-sans text-[0.9rem] font-semibold text-[#F5F8FA] no-underline transition-colors duration-200 hover:bg-[#1E4099]">
                    ส่งอีเมลหาผม
                    <svg class="h-3.5 w-3.5 transition-transform duration-200 group-hover:translate-x-0.5"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M7 17L17 7M17 7H7M17 7v10" />
                    </svg>
                </a>
            </div>

            <!-- Right: link groups -->
            <div class="flex gap-16">
                <div>
                    <p class="m-0 mb-5 font-sans text-[0.8rem] font-semibold text-[#14202B]">เมนู</p>
                    <ul class="m-0 flex list-none flex-col gap-3 p-0">
                        <li *ngFor="let link of navLinks">
                            <a [routerLink]="link.path"
                                class="font-sans text-[0.9rem] text-[#3B4750] no-underline transition-colors duration-200 hover:text-[#2955C8]">
                                {{ link.label }}
                            </a>
                        </li>
                    </ul>
                </div>
                <div>
                    <p class="m-0 mb-5 font-sans text-[0.8rem] font-semibold text-[#14202B]">ช่องทาง</p>
                    <ul class="m-0 flex list-none flex-col gap-3 p-0">
                        <li *ngFor="let social of socials">
                            <a [href]="social.url" target="_blank" rel="noopener"
                                class="font-sans text-[0.9rem] text-[#3B4750] no-underline transition-colors duration-200 hover:text-[#2955C8]">
                                {{ social.label }}
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Divider -->
        <div class="mb-6 h-px bg-[#C9D2D8]"></div>

        <!-- Bottom bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 font-sans text-[0.82rem] text-[#3B4750]">
            <span>© {{ currentYear }} Peerapat Kallabut</span>
            <div class="flex items-center gap-2">
                <span class="text-[#8B96A0]">สร้างด้วย</span>
                <span *ngFor="let tech of builtWith"
                    class="border border-[#C9D2D8] px-2.5 py-1 text-[0.78rem] text-[#3B4750]">{{ tech }}</span>
            </div>
        </div>

    </div>
</footer>
